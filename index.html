<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AHD Brand Calendar 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #F5F0E8; --warm-white: #FAF8F4;
    --ink: #1C1917; --ink-muted: #8A8278; --rule: #D8D0C4;
    --col-w: 220px; --label-w: 160px; --row-h: 200px;
    --ts-row-h: 90px;
    --mg: #2D4A3E; --mg-light: #E8F0EC;
    --pp: #5C3D2E; --pp-light: #F0EAE5;
    --bp: #1E3A5F; --bp-light: #E5ECF4;
    --bj: #4A3728; --bj-light: #EDE8E3;
    --ahd: #2C2C2C; --ahd-light: #EEEAE4;
    --tag-launch: #2D4A3E; --tag-catalog: #5C3D2E; --tag-pricelist: #1E3A5F;
    --tag-tradeshow: #2C2C2C; --tag-maildrop: #6B4C35; --tag-salesrep: #7A6845; --tag-customer: #4A5568;
    /* Heights of sticky chrome above the frozen rows — set by JS */
    --chrome-h: 0px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Roboto', sans-serif; background: var(--cream); color: var(--ink); min-height: 100vh; font-size: 14px; overflow-x: hidden; }

  /* ── PAGE CHROME (all sticky) ── */
  #chrome {
    position: sticky;
    top: 0;
    z-index: 100;
    background: var(--cream);
  }

  header { background: var(--ink); color: var(--cream); padding: 18px 32px; display: flex; align-items: center; justify-content: space-between; gap: 20px; }
  .header-left h1 { font-family: 'Instrument Serif', serif; font-size: 26px; font-weight: 400; letter-spacing: 0.1em; text-transform: uppercase; }
  .header-left p { margin-top: 3px; font-size: 11px; letter-spacing: 0.2em; color: var(--ink-muted); text-transform: uppercase; }
  .header-right { display: flex; align-items: center; gap: 10px; }
  .year-select { background: transparent; border: 1px solid #444; color: var(--cream); padding: 5px 10px; font-family: 'Roboto', sans-serif; font-size: 13px; cursor: pointer; }
  .btn { padding: 6px 14px; font-family: 'Roboto', sans-serif; font-size: 12px; letter-spacing: 0.1em; cursor: pointer; border: none; text-transform: uppercase; white-space: nowrap; }
  .btn-primary { background: var(--cream); color: var(--ink); }
  .btn-ghost { background: transparent; border: 1px solid #555; color: #aaa; }
  .btn-ghost:hover { border-color: var(--cream); color: var(--cream); }
  .btn-danger { background: #8B2020; color: white; }

  .legend { background: var(--warm-white); border-bottom: 1px solid var(--rule); padding: 7px 32px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .legend-label { font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--ink-muted); margin-right: 4px; }
  .tag { display: inline-flex; align-items: center; gap: 4px; padding: 2px 7px; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; font-weight: 500; border-radius: 2px; white-space: nowrap; }
  .tag-dot { width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; }
  .tag.launch    { background: #E8F0EC; color: var(--tag-launch); }
  .tag.catalog   { background: #EDE8E3; color: var(--tag-catalog); }
  .tag.pricelist { background: #E5ECF4; color: var(--tag-pricelist); }
  .tag.tradeshow { background: #E8E8E8; color: var(--tag-tradeshow); }
  .tag.maildrop  { background: #EFE7DE; color: var(--tag-maildrop); }
  .tag.salesrep  { background: #F0EBE0; color: var(--tag-salesrep); }
  .tag.customer  { background: #E8EDF4; color: var(--tag-customer); }

  .toolbar { padding: 9px 32px; display: flex; align-items: center; gap: 12px; background: var(--cream); border-bottom: 1px solid var(--rule); }
  .search-input { padding: 5px 10px; border: 1px solid var(--rule); background: var(--warm-white); font-family: 'Roboto', sans-serif; font-size: 13px; color: var(--ink); width: 200px; outline: none; }
  .search-input:focus { border-color: var(--ink); }
  .toolbar-note { margin-left: auto; font-size: 11px; color: var(--ink-muted); }
  .view-toggle { display: flex; }
  .view-btn { padding: 5px 12px; font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; cursor: pointer; border: 1px solid var(--rule); background: none; color: var(--ink-muted); font-family: 'Roboto', sans-serif; }
  .view-btn:first-child { border-right: none; }
  .view-btn.active { background: var(--ink); color: var(--cream); border-color: var(--ink); }

  /* ── FROZEN HEADER (month row + trade show row) ── */
  /* sits inside #chrome so it scrolls off the page with the chrome block as one unit,
     but the whole #chrome block is sticky so everything freezes together */
  .frozen-scroll {
    overflow: hidden; /* clips but doesn't show scrollbar — synced via JS */
    border-bottom: 2px solid var(--rule);
  }

  .frozen-grid {
    display: grid;
    grid-template-columns: var(--label-w) repeat(12, var(--col-w));
    min-width: calc(var(--label-w) + 12 * var(--col-w));
  }

  /* corner cells */
  .f-corner {
    background: var(--ink);
    position: sticky;
    left: 0;
    z-index: 20;
    border-right: 2px solid #333;
    border-bottom: 1px solid #333;
  }
  .f-corner-ts {
    background: #F2EDE6;
    position: sticky;
    left: 0;
    z-index: 20;
    border-right: 2px solid var(--rule);
    border-bottom: 1px solid var(--rule);
    border-left: 4px solid var(--ahd);
    padding: 10px 14px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 3px;
  }
  .f-corner-ts .brand-label-name { font-family: 'Instrument Serif', serif; font-size: 15px; letter-spacing: 0.06em; }
  .f-corner-ts .brand-label-tag  { font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; font-weight: 500; color: var(--ahd); }

  /* month header cells */
  .f-month {
    background: var(--ink);
    color: var(--cream);
    padding: 10px 14px;
    border-right: 1px solid #333;
    border-bottom: 1px solid #333;
    font-family: 'Instrument Serif', serif;
    font-size: 18px;
    letter-spacing: 0.06em;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
  }
  .f-month-num { font-family: 'Roboto', sans-serif; font-size: 10px; color: #666; letter-spacing: 0.15em; margin-bottom: 2px; }

  /* trade show data cells in frozen row */
  .f-ts-cell {
    background: #F5F0E9;
    border-right: 1px solid var(--rule);
    border-bottom: 1px solid var(--rule);
    padding: 8px 10px;
    min-height: var(--ts-row-h);
    display: flex;
    flex-direction: column;
    gap: 4px;
    position: relative;
  }
  .f-ts-cell.even-col { background: #F0EAE2; }
  .f-ts-cell:hover { background: #EDE6DC; }

  .add-cell-btn {
    position: absolute; bottom: 5px; right: 5px;
    width: 17px; height: 17px;
    border: 1px solid var(--rule); background: var(--cream); color: var(--ink-muted);
    font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center;
    border-radius: 2px; opacity: 0; transition: opacity 0.15s; line-height: 1;
  }
  .f-ts-cell:hover .add-cell-btn,
  .cal-cell:hover .add-cell-btn { opacity: 1; }

  /* ── SCROLLABLE BODY ── */
  .body-scroll {
    overflow-x: auto;
    overflow-y: visible;
    -webkit-overflow-scrolling: touch;
    padding-bottom: 40px;
  }
  .body-scroll.hidden { display: none; }

  .body-grid {
    display: grid;
    grid-template-columns: var(--label-w) repeat(12, var(--col-w));
    min-width: calc(var(--label-w) + 12 * var(--col-w));
    border-top: 1px solid var(--rule);
  }

  .cal-brand-label {
    position: sticky; left: 0; z-index: 5;
    background: var(--warm-white);
    border-right: 2px solid var(--rule);
    border-bottom: 1px solid var(--rule);
    padding: 14px 16px;
    display: flex; flex-direction: column; justify-content: center; gap: 4px;
    min-height: var(--row-h);
  }
  .cal-brand-label.MG  { border-left: 4px solid var(--mg); }
  .cal-brand-label.PP  { border-left: 4px solid var(--pp); }
  .cal-brand-label.BP  { border-left: 4px solid var(--bp); }
  .cal-brand-label.BJ  { border-left: 4px solid var(--bj); }
  .brand-label-name { font-family: 'Instrument Serif', serif; font-size: 16px; letter-spacing: 0.06em; line-height: 1.2; }
  .brand-label-tag { font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; font-weight: 500; margin-top: 2px; }
  .brand-label-tag.MG { color: var(--mg); }
  .brand-label-tag.PP { color: var(--pp); }
  .brand-label-tag.BP { color: var(--bp); }
  .brand-label-tag.BJ { color: var(--bj); }

  .cal-cell {
    background: var(--warm-white);
    border-right: 1px solid var(--rule);
    border-bottom: 1px solid var(--rule);
    padding: 10px;
    min-height: var(--row-h);
    display: flex; flex-direction: column; gap: 5px;
    position: relative;
  }
  .cal-cell.even-col { background: #F8F4ED; }
  .cal-cell:hover { background: #F0EBE2; }

  /* events */
  .event { display: flex; flex-direction: column; gap: 2px; padding: 5px 7px; border-radius: 2px; cursor: pointer; transition: opacity 0.15s; }
  .event:hover { opacity: 0.82; }
  .event.launch    { background: var(--tag-launch);    color: white; }
  .event.catalog   { background: var(--tag-catalog);   color: white; }
  .event.pricelist { background: var(--tag-pricelist); color: white; }
  .event.tradeshow { background: var(--tag-tradeshow); color: white; }
  .event.maildrop  { background: var(--tag-maildrop);  color: white; }
  .event.salesrep  { background: #EDE5D8; color: var(--tag-salesrep); }
  .event.customer  { background: #DDE5F0; color: var(--tag-customer); }
  .event-name { font-size: 11px; font-weight: 500; line-height: 1.3; }
  .event-date { font-size: 10px; opacity: 0.8; }

  /* ── LIST VIEW ── */
  .list-view { display: none; padding: 24px 32px 60px; }
  .list-view.active { display: block; }
  .list-table { width: 100%; border-collapse: collapse; border: 1px solid var(--rule); }
  .list-table th { background: var(--ink); color: var(--cream); text-align: left; padding: 9px 13px; font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; font-weight: 400; }
  .list-table td { padding: 9px 13px; border-bottom: 1px solid var(--rule); font-size: 13px; vertical-align: middle; }
  .list-table tr:hover td { background: var(--cream); cursor: pointer; }
  .list-table tr:last-child td { border-bottom: none; }
  .brand-pill { display: inline-block; padding: 2px 7px; font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase; border-radius: 2px; font-weight: 500; }
  .brand-pill.MG  { background: var(--mg-light);  color: var(--mg); }
  .brand-pill.PP  { background: var(--pp-light);  color: var(--pp); }
  .brand-pill.BP  { background: var(--bp-light);  color: var(--bp); }
  .brand-pill.BJ  { background: var(--bj-light);  color: var(--bj); }
  .brand-pill.AHD { background: var(--ahd-light); color: var(--ahd); }

  /* ── MODAL ── */
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(28,25,23,0.55); z-index: 400; align-items: center; justify-content: center; }
  .modal-overlay.open { display: flex; }
  .modal { background: var(--warm-white); width: 460px; max-width: 95vw; max-height: 90vh; overflow-y: auto; padding: 30px; box-shadow: 0 20px 60px rgba(0,0,0,0.25); }
  .modal h2 { font-family: 'Instrument Serif', serif; font-size: 22px; font-weight: 400; letter-spacing: 0.08em; margin-bottom: 22px; text-transform: uppercase; }
  .form-group { margin-bottom: 14px; }
  .form-group label { display: block; font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--ink-muted); margin-bottom: 5px; }
  .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 7px 10px; border: 1px solid var(--rule); background: var(--cream); font-family: 'Roboto', sans-serif; font-size: 13px; color: var(--ink); outline: none; }
  .form-group input:focus, .form-group select:focus { border-color: var(--ink); }
  .form-group textarea { resize: vertical; min-height: 56px; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--rule); }
</style>
</head>
<body>

<!-- ALL STICKY CHROME + FROZEN ROWS IN ONE BLOCK -->
<div id="chrome">
  <header>
    <div class="header-left">
      <h1>AHD Brand Calendar</h1>
      <p>Launch &amp; Marketing Schedule — Editable</p>
    </div>
    <div class="header-right">
      <select class="year-select" onchange="setYear(this.value)">
        <option value="2026" selected>2026</option>
        <option value="2027">2027</option>
      </select>
      <button class="btn btn-primary" onclick="openAddModal()">+ Add Event</button>
      <button class="btn btn-ghost" onclick="exportCSV()">Export CSV</button>
    </div>
  </header>

  <div class="legend">
    <span class="legend-label">Key</span>
    <span class="tag launch"><span class="tag-dot" style="background:var(--tag-launch)"></span>Web Launch</span>
    <span class="tag catalog"><span class="tag-dot" style="background:var(--tag-catalog)"></span>Catalog Upload</span>
    <span class="tag pricelist"><span class="tag-dot" style="background:var(--tag-pricelist)"></span>Price List</span>
    <span class="tag tradeshow"><span class="tag-dot" style="background:var(--tag-tradeshow)"></span>Trade Show</span>
    <span class="tag maildrop"><span class="tag-dot" style="background:var(--tag-maildrop)"></span>Mail Drop</span>
    <span class="tag salesrep"><span class="tag-dot" style="background:var(--tag-salesrep)"></span>Sales Rep In-Hand</span>
    <span class="tag customer"><span class="tag-dot" style="background:var(--tag-customer)"></span>Customer In-Hand</span>
  </div>

  <div class="toolbar">
    <div class="view-toggle">
      <button class="view-btn active" id="gridViewBtn" onclick="setView('grid')">Timeline</button>
      <button class="view-btn" id="listViewBtn" onclick="setView('list')">List</button>
    </div>
    <input class="search-input" type="text" placeholder="Search events…" oninput="searchEvents(this.value)">
    <span class="toolbar-note">Click any event to edit &nbsp;·&nbsp; Scroll right to navigate months</span>
  </div>

  <!-- FROZEN SCROLL: month headers + trade show row -->
  <div class="frozen-scroll" id="frozenScroll">
    <div class="frozen-grid" id="frozenGrid"></div>
  </div>
</div>

<!-- SCROLLABLE BRAND ROWS -->
<div class="body-scroll" id="bodyScroll">
  <div class="body-grid" id="bodyGrid"></div>
</div>

<!-- LIST VIEW -->
<div class="list-view" id="listView">
  <table class="list-table">
    <thead><tr><th>Date</th><th>Brand</th><th>Event</th><th>Type</th><th>Notes</th></tr></thead>
    <tbody id="listBody"></tbody>
  </table>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <h2 id="modalTitle">Add Event</h2>
    <div class="form-row">
      <div class="form-group"><label>Brand</label>
        <select id="fBrand">
          <option value="MG">Made Goods</option>
          <option value="PP">Pigeon &amp; Poodle</option>
          <option value="BP">Blue Pheasant</option>
          <option value="BJ">Burton James</option>
          <option value="AHD">AHD (All Brands)</option>
        </select>
      </div>
      <div class="form-group"><label>Type</label>
        <select id="fType">
          <option value="launch">Web Launch</option>
          <option value="catalog">Catalog Upload</option>
          <option value="pricelist">Price List</option>
          <option value="tradeshow">Trade Show</option>
          <option value="maildrop">Mail Drop</option>
          <option value="salesrep">Sales Rep In-Hand</option>
          <option value="customer">Customer In-Hand</option>
        </select>
      </div>
    </div>
    <div class="form-group"><label>Event Name</label><input type="text" id="fName" placeholder="e.g. Spring Web Launch"></div>
    <div class="form-row">
      <div class="form-group"><label>Start Date</label><input type="date" id="fStart"></div>
      <div class="form-group"><label>End Date (optional)</label><input type="date" id="fEnd"></div>
    </div>
    <div class="form-group"><label>Notes</label><textarea id="fNotes" placeholder="Any additional details…"></textarea></div>
    <div class="modal-actions">
      <button class="btn btn-danger" id="deleteBtn" onclick="deleteEvent()" style="display:none">Delete</button>
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveEvent()">Save Event</button>
    </div>
  </div>
</div>

<script>

let currentYear='2026', currentView='grid', editingId=null, searchQuery='', events={};

function loadData(){
  try{
    const s=localStorage.getItem('ahd_cal_v4');
    if(s){events=JSON.parse(s);}
    else{events={};SEED.forEach(e=>{events[e.id]=e;});saveData();}
  }catch(e){events={};SEED.forEach(e=>{events[e.id]=e;});}
}
function saveData(){try{localStorage.setItem('ahd_cal_v4',JSON.stringify(events));}catch(e){}}

function eventsFor(year,brand,mi){
  return Object.values(events).filter(e=>{
    if(!e.start||!e.start.startsWith(year))return false;
    if(parseInt(e.start.split('-')[1],10)-1!==mi)return false;
    if(e.brand!==brand)return false;
    if(searchQuery&&!e.name.toLowerCase().includes(searchQuery)&&!(e.notes||'').toLowerCase().includes(searchQuery))return false;
    return true;
  }).sort((a,b)=>a.start.localeCompare(b.start));
}

function render(){renderFrozen();renderBody();renderList();}

function renderFrozen(){
  const g=document.getElementById('frozenGrid');
  let h='';
  // Row 1: corner + month headers
  h+=`<div class="f-corner"></div>`;
  MONTHS.forEach((m,i)=>{
    h+=`<div class="f-month"><span>${m}</span><span class="f-month-num">${String(i+1).padStart(2,'0')}</span></div>`;
  });
  // Row 2: AHD label + trade show cells
  h+=`<div class="f-corner-ts"><span class="brand-label-name">Trade Shows</span><span class="brand-label-tag">AHD</span></div>`;
  MONTHS.forEach((m,mi)=>{
    const evs=eventsFor(currentYear,'AHD',mi);
    const chips=evs.map(e=>`<div class="event ${e.type}" onclick="openEdit('${e.id}')" title="${(e.notes||'').replace(/"/g,'&quot;')}"><div class="event-name">${e.name}</div><div class="event-date">${fmtRange(e.start,e.end)}</div></div>`).join('');
    const dateStr=`${currentYear}-${String(mi+1).padStart(2,'0')}-01`;
    h+=`<div class="f-ts-cell${mi%2===1?' even-col':''}">${chips}<button class="add-cell-btn" onclick="openAddModal('${dateStr}','AHD')" title="Add event">+</button></div>`;
  });
  g.innerHTML=h;
}

function renderBody(){
  const g=document.getElementById('bodyGrid');
  let h='';
  BRAND_ORDER.forEach(brand=>{
    h+=`<div class="cal-brand-label ${brand}"><span class="brand-label-name">${BRAND_NAMES[brand]}</span><span class="brand-label-tag ${brand}">${brand}</span></div>`;
    MONTHS.forEach((m,mi)=>{
      const evs=eventsFor(currentYear,brand,mi);
      const chips=evs.map(e=>`<div class="event ${e.type}" onclick="openEdit('${e.id}')" title="${(e.notes||'').replace(/"/g,'&quot;')}"><div class="event-name">${e.name}</div><div class="event-date">${fmtRange(e.start,e.end)}</div></div>`).join('');
      const dateStr=`${currentYear}-${String(mi+1).padStart(2,'0')}-01`;
      h+=`<div class="cal-cell${mi%2===1?' even-col':''}">${chips}<button class="add-cell-btn" onclick="openAddModal('${dateStr}','${brand}')" title="Add event">+</button></div>`;
    });
  });
  g.innerHTML=h;
}

function renderList(){
  const tbody=document.getElementById('listBody');
  const all=Object.values(events)
    .filter(e=>e.start&&e.start.startsWith(currentYear))
    .filter(e=>!searchQuery||e.name.toLowerCase().includes(searchQuery)||(e.notes||'').toLowerCase().includes(searchQuery))
    .sort((a,b)=>{
      if(a.start!==b.start)return a.start.localeCompare(b.start);
      const bo=[...BRAND_ORDER,'AHD'];
      return bo.indexOf(a.brand)-bo.indexOf(b.brand);
    });
  tbody.innerHTML=all.map(e=>`<tr onclick="openEdit('${e.id}')"><td>${fmtRange(e.start,e.end)}</td><td><span class="brand-pill ${e.brand}">${e.brand}</span></td><td>${e.name}</td><td><span class="tag ${e.type}">${TYPE_LABELS[e.type]||e.type}</span></td><td style="color:var(--ink-muted);max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${e.notes||''}</td></tr>`).join('')||`<tr><td colspan="5" style="color:var(--ink-muted);text-align:center;padding:24px">No events found</td></tr>`;
}

function fmtRange(s,e){
  if(!s)return'—';
  const sd=s.split('-'),ed=(e||'').split('-');
  const sf=`${MONTHS[parseInt(sd[1])-1].slice(0,3)} ${parseInt(sd[2])}`;
  if(!e||e===''||e===s)return sf;
  if(ed[0]===sd[0]&&ed[1]===sd[1])return`${sf}\u2013${parseInt(ed[2])}`;
  return`${sf} \u2013 ${MONTHS[parseInt(ed[1])-1].slice(0,3)} ${parseInt(ed[2])}`;
}

// Sync horizontal scroll between frozen and body
function syncScroll(){
  const frozen=document.getElementById('frozenScroll');
  const body=document.getElementById('bodyScroll');
  body.addEventListener('scroll',()=>{ frozen.scrollLeft=body.scrollLeft; });
  frozen.addEventListener('scroll',()=>{ body.scrollLeft=frozen.scrollLeft; });
}

function openAddModal(d,b){
  editingId=null;
  document.getElementById('modalTitle').textContent='Add Event';
  document.getElementById('deleteBtn').style.display='none';
  document.getElementById('fBrand').value=b||'MG';
  document.getElementById('fType').value = b==='AHD' ? 'tradeshow' : 'launch';
  document.getElementById('fName').value='';
  document.getElementById('fStart').value=d||`${currentYear}-01-01`;
  document.getElementById('fEnd').value='';
  document.getElementById('fNotes').value='';
  document.getElementById('modalOverlay').classList.add('open');
}

function openEdit(id){
  const e=events[id];if(!e)return;
  editingId=id;
  document.getElementById('modalTitle').textContent='Edit Event';
  document.getElementById('deleteBtn').style.display='block';
  document.getElementById('fBrand').value=e.brand;
  document.getElementById('fType').value=e.type;
  document.getElementById('fName').value=e.name;
  document.getElementById('fStart').value=e.start;
  document.getElementById('fEnd').value=e.end||'';
  document.getElementById('fNotes').value=e.notes||'';
  document.getElementById('modalOverlay').classList.add('open');
}

function closeModal(e){
  if(e&&e.target!==document.getElementById('modalOverlay'))return;
  document.getElementById('modalOverlay').classList.remove('open');
}

function saveEvent(){
  const brand=document.getElementById('fBrand').value;
  const type=document.getElementById('fType').value;
  const name=document.getElementById('fName').value.trim();
  const start=document.getElementById('fStart').value;
  const end=document.getElementById('fEnd').value;
  const notes=document.getElementById('fNotes').value.trim();
  if(!name||!start){alert('Name and start date are required.');return;}
  const id=editingId||('e_'+Date.now());
  events[id]={id,brand,type,name,start,end,notes};
  saveData();
  document.getElementById('modalOverlay').classList.remove('open');
  render();
}

function deleteEvent(){
  if(!editingId||!confirm('Delete this event?'))return;
  delete events[editingId];saveData();
  document.getElementById('modalOverlay').classList.remove('open');render();
}

function setYear(y){currentYear=y;render();}

function setView(v){
  currentView=v;
  const showGrid=v==='grid';
  document.getElementById('bodyScroll').classList.toggle('hidden',!showGrid);
  document.getElementById('frozenScroll').style.display=showGrid?'':'none';
  document.getElementById('listView').classList.toggle('active',!showGrid);
  document.getElementById('gridViewBtn').classList.toggle('active',showGrid);
  document.getElementById('listViewBtn').classList.toggle('active',!showGrid);
}

function searchEvents(q){searchQuery=q.toLowerCase().trim();render();}

function exportCSV(){
  const all=Object.values(events).filter(e=>e.start&&e.start.startsWith(currentYear)).sort((a,b)=>a.start.localeCompare(b.start));
  const rows=[['Brand','Type','Event','Start Date','End Date','Notes']];
  all.forEach(e=>rows.push([BRAND_NAMES[e.brand]||e.brand,TYPE_LABELS[e.type]||e.type,e.name,e.start,e.end||'',(e.notes||'').replace(/,/g,' ')]));
  const csv=rows.map(r=>r.map(c=>`"${c}"`).join(',')).join('\n');
  const a=document.createElement('a');
  a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv);
  a.download=`AHD-Calendar-${currentYear}.csv`;a.click();
}

loadData();render();syncScroll();
</script>
